<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5ebce" />
    <meta
      name="description"
      content="A face-to-face fantasy tactics game for two players on one phone."
    />
    <title>Threefold Duel · Lai Wei</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="welcome">
      <nav>
        <a href="/projects/#fun">← Fun projects</a
        ><span>Lai Wei <b>✦</b> Game Room</span>
      </nav>
      <section class="intro">
        <div class="copy">
          <p class="kicker">Face-to-face tactics</p>
          <h1>
            Threefold<br /><em>Duel</em
            ><span class="sun" aria-hidden="true">✷</span>
          </h1>
          <p class="lead">
            Two players. One phone. Command three heroes, choose your moves in
            secret, and draft the cards that shape your party.
          </p>
          <div class="start-actions">
            <button class="primary" id="start">Start duel <span>→</span></button
            ><button class="secondary" id="rules">How to play</button>
          </div>
        </div>
        <div class="illustration" aria-label="The three starting heroes">
          <div class="orbit" aria-hidden="true"></div>
          <div class="portrait p-f">
            <small>Fighter</small
            ><img
              src="./art/fighter-guardian.svg"
              alt="Armored guardian with shield and sword"
            /><b>◆</b>
          </div>
          <div class="portrait p-p">
            <small>Priest</small
            ><img
              src="./art/priest-healer.svg"
              alt="Priest with a golden halo"
            /><b>✷</b>
          </div>
          <div class="portrait p-m">
            <small>Mage</small
            ><img
              src="./art/mage-elementalist.svg"
              alt="Hooded mage wielding cyan magic"
            /><b>✦</b>
          </div>
        </div>
      </section>
      <section class="codex">
        <header>
          <div>
            <p class="kicker">Party guide</p>
            <h2>Choose your path</h2>
          </div>
          <button id="library" class="text">Card collection ↗</button>
        </header>
        <div id="paths"></div>
      </section>
    </main>
    <main id="table" hidden></main>
    <dialog id="info">
      <button class="exit" aria-label="Close">×</button>
      <div id="info-body"></div>
    </dialog>
    <noscript>Enable JavaScript to play Threefold Duel.</noscript>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
